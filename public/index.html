<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dentlab Plattform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: App-Shell mit fester Seitenleiste links, Suchleiste oben, Arbeitsfläche in hellen Karten. Tiefes Laborgrün als Akzent, Status als farbige Chips. */
:root {
  --bg: #F6F7F5; --surface: #FFFFFF; --sunken: #F3F5F2; --ink: #1B2420; --muted: #6B756F; --line: #E4E8E3;
  --accent: #1F4D3F; --accent-ink: #FFFFFF; --accent-soft: #E3EFE8;
  --ok: #2F7A55; --ok-soft: #E4F2EA; --warn: #B7741A; --warn-soft: #FDF1DE; --bad: #C24133; --bad-soft: #FCE7E4;
  --blue: #3F6FB5; --blue-soft: #E6EEF9; --violet: #6E5BA8; --violet-soft: #EEEAF7;
  --off: repeating-linear-gradient(135deg, #ECEFEB 0 6px, #F5F7F4 6px 12px);
  --f-display: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1311; --surface: #171D1A; --sunken: #131815; --ink: #E6ECE8; --muted: #95A29B; --line: #26302B;
  --accent: #7CC4A2; --accent-ink: #0F1A15; --accent-soft: #1D3329;
  --ok: #6CC795; --ok-soft: #183025; --warn: #E2AE55; --warn-soft: #33280F; --bad: #F07D70; --bad-soft: #3A1D1A;
  --blue: #8AB0E8; --blue-soft: #1A2638; --violet: #B3A3E6; --violet-soft: #262040;
  --off: repeating-linear-gradient(135deg, #1A211D 0 6px, #151A17 6px 12px);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1311; --surface: #171D1A; --sunken: #131815; --ink: #E6ECE8; --muted: #95A29B; --line: #26302B;
  --accent: #7CC4A2; --accent-ink: #0F1A15; --accent-soft: #1D3329;
  --ok: #6CC795; --ok-soft: #183025; --warn: #E2AE55; --warn-soft: #33280F; --bad: #F07D70; --bad-soft: #3A1D1A;
  --blue: #8AB0E8; --blue-soft: #1A2638; --violet: #B3A3E6; --violet-soft: #262040;
  --off: repeating-linear-gradient(135deg, #1A211D 0 6px, #151A17 6px 12px);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.grow { flex: 1; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 20px; } h3 { font-size: 15px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding: 24px 18px 18px max(18px, env(safe-area-inset-left, 0px)); }
.logo { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
.logo .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.logo b { display: block; font-weight: 700; letter-spacing: 0.14em; font-size: 14px; }
.logo small { display: block; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: 0.16em; }
.ws { display: flex; gap: 10px; align-items: center; background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.ws .av { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.ws small { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; white-space: nowrap; } .ws b { font-weight: 600; font-size: 13.5px; }
nav.tabs { display: grid; gap: 4px; }
nav.tabs button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 10px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; font-weight: 500; font-size: 14.5px; text-align: left; white-space: nowrap; }
nav.tabs button svg { flex: none; }
nav.tabs button .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.tabs button .cnt.bad { color: var(--bad); font-weight: 600; }
nav.tabs button:hover { background: var(--sunken); color: var(--ink); }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidefoot { margin-top: auto; display: grid; gap: 8px; }
.stat { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; }
.stat .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.stat small { display: block; color: var(--muted); font-size: 11px; } .stat b { font-weight: 600; }
.stat .led { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex: none; }
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; gap: 10px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; max-width: 520px; display: flex; align-items: center; gap: 10px; color: var(--muted); }
.search input { border: 0 !important; background: transparent !important; padding: 8px 0 !important; font-size: 14px; }
.topbar .grow { flex: 1; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
main { padding-block: 28px 56px; display: grid; gap: 20px; }
@media (max-width: 900px) {
  .app { display: block; }
  .side { position: static; height: auto; flex-direction: column; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .sidefoot, .navlabel { display: none; }
  .ws { padding: 6px 10px; }
  nav.tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
  nav.tabs button { padding: 8px 10px; font-size: 13.5px; } nav.tabs button .cnt { margin-left: 4px; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { padding-block: 10px; } .search { min-width: 0; flex-basis: 100%; max-width: none; }
}
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
.btn.primary { box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.danger { color: var(--bad); }
.btn.danger[data-armed] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { padding: 4px 8px; font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; min-width: 0; }
.eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
h2 { font-size: 18px; font-weight: 700; }
.panel > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel > header .grow { flex: 1; }
.cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cols.wide-left { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.cols.form-left { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); }
@media (max-width: 900px) { .cols, .cols.wide-left, .cols.form-left { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; text-align: left; cursor: pointer; position: relative; border-top: 3px solid var(--line); padding-right: 30px; align-content: start; }
.kpi:hover { border-color: var(--muted); }
.kpi[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kpi .chev { position: absolute; right: 12px; bottom: 12px; color: var(--muted); transition: transform .15s; font-size: 12px; }
.kpi[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }
.kpi.bad { border-top-color: var(--bad); } .kpi.warn { border-top-color: var(--warn); } .kpi.good { border-top-color: var(--ok); }
.drawer { border-top: 3px solid var(--accent); }
.caprow { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 64px 84px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.caprow:last-child { border-bottom: 0; }
@media (max-width: 560px) { .caprow { grid-template-columns: minmax(0, 1fr) 54px 70px; } .caprow .bar { display: none; } }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi.bad .v { color: var(--bad); } .kpi.warn .v { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-soft); }
.s-knapp { color: var(--warn); background: var(--warn-soft); }
.s-spaet, .s-problem { color: var(--bad); background: var(--bad-soft); }
.s-done { color: var(--muted); background: var(--sunken); }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--line); margin: 0 4px 4px 0; }
.eilt { color: var(--bad); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunken); }
td.r, th.r { text-align: right; }

/* Heatmap & Plantafel */
.grid-res { border-collapse: separate; border-spacing: 3px; width: auto; min-width: 100%; }
.grid-res th, .grid-res td { border: 0; padding: 0; }
.grid-res th.day { text-align: center; font-size: 11px; padding: 0 0 4px; text-transform: none; letter-spacing: 0; min-width: 52px; }
.grid-res th.day.today { color: var(--accent); }
.grid-res th.res { text-align: left; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 500; padding-right: 10px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.grid-res th.res .muted { font-weight: 400; font-size: 11.5px; }
.cell { width: 100%; height: 34px; border: 0; border-radius: 4px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; display: grid; place-items: center; }
.cell.off { background: var(--off); color: var(--muted); cursor: default; font-family: var(--f-body); font-size: 11px; }
.cell.over { background: var(--bad); color: var(--surface); font-weight: 600; }
.dot { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 600; font-family: var(--f-display); flex: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

.board td.slot { min-width: 128px; vertical-align: top; background: var(--sunken); border-radius: 4px; padding: 4px; }
.board td.slot.off { background: var(--off); }
.board .cap { font-size: 10.5px; color: var(--muted); font-family: var(--f-mono); display: flex; justify-content: space-between; padding: 0 2px 3px; }
.chip { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--ok); background: var(--surface); border-radius: 3px; padding: 3px 6px; margin-bottom: 3px; font-size: 11.5px; line-height: 1.3; cursor: pointer; }
.chip b { font-family: var(--f-mono); font-weight: 500; }
.chip.st-knapp { border-left-color: var(--warn); } .chip.st-spaet, .chip.st-problem { border-left-color: var(--bad); }
.chip span { color: var(--muted); }

/* Liste */
.alist { display: grid; gap: 0; }
.aitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.aitem:last-child { border-bottom: 0; }
.aitem .t { font-weight: 500; } .aitem .d { font-size: 12.5px; color: var(--muted); }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }

/* Formular */
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
label.f > span { letter-spacing: 0.01em; }
input[type=text], input[type=number], input[type=date], input[type=password], select, textarea { width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--ink); min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
textarea { resize: vertical; min-height: 60px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font-size: 13.5px; }
.hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }

/* Verdict */
.verdict { border-radius: var(--r); padding: 16px; display: grid; gap: 6px; border: 1px solid var(--line); }
.verdict.ok { background: var(--ok-soft); border-color: transparent; } .verdict.knapp { background: var(--warn-soft); border-color: transparent; } .verdict.spaet, .verdict.problem { background: var(--bad-soft); border-color: transparent; }
.verdict .big { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.verdict.ok .big { color: var(--ok); } .verdict.knapp .big { color: var(--warn); } .verdict.spaet .big, .verdict.problem .big { color: var(--bad); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
.facts div { display: grid; gap: 1px; } .facts .k { font-size: 12px; color: var(--muted); } .facts .v { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } }

/* Schritte-Zeitleiste */
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: start; }
.step:last-child { border-bottom: 0; }
.step .ix { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; font-family: var(--f-mono); color: var(--muted); margin-top: 1px; }
.step.done .ix { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.step.tryin .ix { border-color: var(--accent); color: var(--accent); }
.step .nm { font-weight: 500; } .step .meta { font-size: 12.5px; color: var(--muted); }
.step .when { font-family: var(--f-mono); font-size: 12.5px; text-align: right; white-space: nowrap; }
.step .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
.step .ctl input[type=date], .step .ctl select { width: auto; padding: 4px 7px; font-size: 13px; }
.warnline { color: var(--bad); font-size: 12.5px; }

/* Stammdaten */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; background: var(--surface); align-content: start; }
.card .hd { display: flex; gap: 10px; align-items: center; }
.card .hd .grow { flex: 1; min-width: 0; }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar > i.over { background: var(--bad); }
.steptable td { padding: 4px; border: 0; }
.steptable input, .steptable select { padding: 5px 7px; font-size: 13px; }
.steptable .n { width: 72px; }

/* Hell/Dunkel-Schalter */
.themesw { position: relative; width: 64px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunken); cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; color: var(--muted); flex: none; }
.themesw .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); transition: transform .18s ease; }
.themesw svg { position: relative; z-index: 1; }
.themesw[aria-checked="true"] .knob { transform: translateX(30px); background: var(--accent); }
.themesw[aria-checked="false"] .sun, .themesw[aria-checked="true"] .moon { color: var(--accent); }
.themesw[aria-checked="true"] .moon { color: var(--accent-ink); }
.themesw[aria-checked="false"] .sun { color: var(--warn); }

/* Übersicht */
.hero { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.hello { font-size: clamp(28px, 4vw, 38px); font-weight: 700; letter-spacing: -0.02em; margin: 2px 0 0; }
.goal { display: flex; gap: 12px; align-items: center; }
.goal b { display: block; font-size: 15px; } .goal small { display: block; font-size: 12px; }
.kpis2 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .kpis2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis2 { grid-template-columns: minmax(0, 1fr); } }
.kpi2 { display: flex; gap: 16px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; cursor: pointer; position: relative; color: var(--ink); }
.kpi2:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.kpi2[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kpic, .kic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.kpi2 .kt { display: grid; gap: 1px; min-width: 0; }
.kpi2 .l { font-size: 12.5px; color: var(--muted); } .kpi2 .v { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; } .kpi2 .s { font-size: 11.5px; color: var(--accent); font-weight: 500; }
.kpi2.bad .v, .kpi2.bad .s { color: var(--bad); }
.kpi2 .chev { position: absolute; right: 14px; top: 14px; color: var(--muted); transition: transform .15s; }
.kpi2[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }
.ovgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .ovgrid { grid-template-columns: minmax(0, 1fr); } }

<script>
"use strict";
/* ---------- Grundlagen ---------- */
const COLLS = ["employees", "absences", "machines", "jobtypes", "orders", "notes", "materials", "cases", "positions", "offers"];
const DEFAULT_CFG = { skills: ["Modellherstellung", "CAD-Konstruktion", "Keramik", "Gerüst/Metall", "Kunststoff/Prothetik", "KFO", "Qualitätskontrolle"], productivity: 0.85, bufferDays: 1, tryinDefaultDays: 2, tryinReturnDays: 1, holidays: [], paceAuto: true, revenueVisibility: "admin", autoLogoutMin: 30 };
const KINDS = { work: "Handarbeit", machine: "Maschine", wait: "Wartezeit", tryin: "Einprobe in Praxis" };
const ABS_TYPES = ["Urlaub", "Krank", "Berufsschule", "Fortbildung", "Sonstiges"];
const ABS_SHORT = { Urlaub: "Urlaub", Krank: "krank", Berufsschule: "Schule", Fortbildung: "Fortb.", Sonstiges: "abw." };
const STATUS_TXT = { ok: "im Plan", knapp: "knapp", spaet: "verspätet", problem: "nicht planbar", done: "geliefert" };
const DOW = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const HORIZON = 160;
const LS_KEY = "laborplaner-lokal-v1";

const S = { employees: {}, absences: {}, machines: {}, jobtypes: {}, orders: {}, notes: {}, materials: {}, cases: {}, positions: {}, offers: {}, config: {} };
let SAMPLE = null, ASSETS = null, USERCAP = null, PACE = {};
let db = null, MODE = "laden", loaded = new Set(), PLAN = { res: {}, used: {}, alloc: [] };
const LS_ME = "laborplaner-arbeitsplatz";
const LS_THEME = "laborplaner-theme";
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function syncTheme() { const b = document.getElementById("themeBtn"); if (b) { b.setAttribute("aria-checked", String(isDark())); b.title = isDark() ? "Zu hellem Modus wechseln" : "Zu dunklem Modus wechseln"; } }
try { const t = localStorage.getItem(LS_THEME); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
const readMe = () => { try { return localStorage.getItem(LS_ME) || ""; } catch (e) { return ""; } };
const UI = { me: readMe(), scanId: null, scanMsg: null, tab: "start", sub: {}, noteId: null, nkind: "alle", nq: "", caseId: null, cfilter: "aktiv", cq: "", mfilter: "alle", rperiod: "3m", ask: { turns: [], busy: false }, login: null, orderFilter: "aktiv", search: "", boardOffset: 0, check: null, modal: null };

const cfg = () => ({ ...DEFAULT_CFG, ...(S.config || {}) });
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);

/* ---------- Datum & Arbeitstage ---------- */
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = iso(new Date());
let HOL = new Set();
const isWd = s => { const g = parse(s).getDay(); return g > 0 && g < 6 && !HOL.has(s); };
const wdOn = s => { let x = s, i = 0; while (!isWd(x) && i++ < 40) x = addDays(x, 1); return x; };
const nextWd = s => wdOn(addDays(s, 1));
const addWd = (s, n) => { let x = wdOn(s); for (let i = 0; i < n; i++) x = nextWd(x); return x; };
const wdDiff = (a, b) => { if (a === b) return 0; let sign = 1; if (b < a) { [a, b] = [b, a]; sign = -1; } let n = 0, x = a, g = 0; while (x < b && g++ < 900) { x = addDays(x, 1); if (isWd(x)) n++; } return n * sign; };
const workdays = (from, n) => { const out = []; let x = wdOn(from); for (let i = 0; i < n; i++) { out.push(x); x = nextWd(x); } return out; };
const fmt = s => s ? DOW[parse(s).getDay()] + " " + s.slice(8, 10) + "." + s.slice(5, 7) + "." : "–";
const fmtMin = m => { m = Math.round(m); if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + ":" + String(r).padStart(2, "0") + " h"; };
const maxD = (a, b) => (a > b ? a : b);

/* ---------- Kapazität ---------- */
function absentOn(empId, d) { for (const a of Object.values(S.absences)) if (a.empId === empId && a.from <= d && d <= (a.to || a.from)) return a; return null; }
function capOf(key, d) {
  if (!isWd(d)) return 0;
  const id = key.slice(2);
  if (key[0] === "m") { const m = S.machines[id]; return m ? Math.round((+m.hoursPerDay || 0) * 60) : 0; }
  const e = S.employees[id]; if (!e || absentOn(id, d)) return 0;
  const ov = (e.dayHours || {})[d];
  const h = ov !== undefined && ov !== null && ov !== "" ? +ov : +(e.hours || [])[parse(d).getDay() - 1] || 0;
  return Math.round(h * 60 * (+cfg().productivity || 0.85));
}
const resKeys = () => [...sortedEmps().map(e => "e:" + e.id), ...Object.values(S.machines).sort((a, b) => a.name.localeCompare(b.name)).map(m => "m:" + m.id)];
const resName = k => k[0] === "e" ? (S.employees[k.slice(2)]?.name || "?") : (S.machines[k.slice(2)]?.name || "?");
const sortedEmps = () => Object.values(S.employees).sort((a, b) => a.name.localeCompare(b.name));
const stepMinutes = (st, units) => Math.round((+st.fixed || 0) + (+st.perUnit || 0) * (+units || 1));
const clampF = x => Math.min(1.6, Math.max(0.4, x));
/* Gemessenes Arbeitstempo: geplante Minuten / tatsächliche Minuten aus den abgehakten Schritten */
function computePace() {
  const P = {};
  for (const o of Object.values(S.orders)) {
    const jt = S.jobtypes[o.typeId]; if (!jt) continue;
    for (const [i, l] of Object.entries(o.doneLog || {})) {
      const st = jt.steps[+i]; if (!st || st.kind !== "work" || !l || !(+l.min > 0) || !(+l.plan > 0) || !S.employees[l.by]) continue;
      const p = P[l.by] = P[l.by] || { all: { p: 0, a: 0, n: 0 }, skills: {} };
      const k = p.skills[st.skill] = p.skills[st.skill] || { p: 0, a: 0, n: 0 };
      for (const x of [p.all, k]) { x.p += +l.plan; x.a += +l.min; x.n++; }
    }
  }
  return P;
}
function factorInfo(id, skill) {
  const e = S.employees[id]; const manual = +(e && e.factor) || 1;
  if (cfg().paceAuto && e && e.paceMode !== "fest") {
    const s = PACE[id]?.skills[skill]; if (s && s.n >= 3) return { f: clampF(s.p / s.a), src: "gemessen", n: s.n };
    const a = PACE[id]?.all; if (a && a.n >= 5) return { f: clampF(a.p / a.a), src: "gemessen (alle Arbeiten)", n: a.n };
  }
  return { f: manual, src: "fest", n: 0 };
}
const factorFor = (id, skill) => factorInfo(id, skill).f;

/* ---------- Planung (Vorwärtsterminierung nach Priorität und Liefertermin) ---------- */
const rank = { ok: 0, knapp: 1, spaet: 2, problem: 3 };
function cmpOrders(a, b) {
  const pa = a.priority === "eilt" ? 0 : 1, pb = b.priority === "eilt" ? 0 : 1;

const CAM = { stream: null, timer: null, det: null };
const BC_FORMATS = ["code_128", "code_39", "code_93", "codabar", "ean_13", "ean_8", "itf", "upc_a", "upc_e", "qr_code", "data_matrix", "aztec", "pdf417"];
async function camDetector() {
  if (CAM.det) return CAM.det;
  if (window.BarcodeDetector) {
    try { const f = await window.BarcodeDetector.getSupportedFormats(); if (f.length) return (CAM.det = new window.BarcodeDetector({ formats: BC_FORMATS.filter(x => f.includes(x)) })); } catch (e) {}
  }
  const m = await import(window.LP_BARCODE_LIB || "https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/pure/+esm");
  return (CAM.det = new m.BarcodeDetector({ formats: BC_FORMATS }));
}
function camHint(t, bad) { const h = $("#camHint"); if (h) { h.textContent = t; h.classList.toggle("bad", !!bad); } }
function closeCam() {
  clearInterval(CAM.timer); CAM.timer = null;
  if (CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
  CAM.stream = null; $("#camOv")?.remove();
}
async function openCam() {
  closeCam();
  document.body.insertAdjacentHTML("beforeend", `<div id="camOv" class="camov" role="dialog" aria-modal="true" aria-label="Auftrag mit der Kamera scannen">
    <div class="camtop"><b>Auftrag scannen</b><button class="btn" data-act="camclose">Schließen</button></div>
    <div class="camview"><video id="camVid" playsinline muted autoplay></video><div class="camframe"></div></div>
    <div class="camhint" id="camHint">Kamera wird gestartet …</div></div>`);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camHint("Die Kamera ist in dieser Ansicht nicht verfügbar. Sie braucht eine sichere Verbindung (https), z. B. die installierte App.", true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch (e) { camHint(e && e.name === "NotAllowedError" ? "Der Kamerazugriff wurde nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite freigeben." : "Keine Kamera gefunden, oder sie wird gerade von einer anderen App benutzt.", true); return; }
  if (!$("#camOv")) { stream.getTracks().forEach(t => t.stop()); return; }

    } catch (e) {}

  }, 200);
}

const noteByTitle = t => { const x = String(t || "").trim().toLowerCase(); return Object.values(S.notes).find(n => (n.title || "").trim().toLowerCase() === x) || null; };

/* Sicheres Markdown: erst alles maskieren, dann nur wenige Formate erlauben */
function mdInline(t, opts) {
  return t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>")
    .replace(/!\[\[([^\]]+)\]\]/g, '<span class="muted">[Bild: $1]</span>')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => { const n = noteByTitle(a.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"')); return n ? `<button class="wl" data-act="opennote" data-id="${esc(n.id)}">${b || a}</button>` : `<span class="wl missing" title="Notiz noch nicht vorhanden">${b || a}</span>`; })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\[(\d{1,2})\]/g, (m, n) => { const src = opts && opts.sources && opts.sources[+n - 1]; return src ? `<button class="src" data-act="opennote" data-id="${esc(src)}" title="${esc(S.notes[src]?.title || "")}">${n}</button>` : m; });
}
function md(text, opts) {
  const lines = esc(text || "").split(/\r?\n/); const out = []; let i = 0;
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const h = Math.min(3, m[1].length); if (!(opts && opts.skipTitle && h === 1 && i === lines.findIndex(x => x.trim()))) out.push(`<h${h}>${mdInline(m[2], opts)}</h${h}>`); i++; continue; }
    if (isTable(l)) {
      const rows = []; while (i < lines.length && isTable(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<div class="tablebox"><table><thead><tr>${cells(body[0]).map(c => `<th>${mdInline(c, opts)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c, opts)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^&gt;\s?/.test(l)) { const q = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) { q.push(lines[i].replace(/^&gt;\s?/, "")); i++; } out.push(`<blockquote>${mdInline(q.join(" "), opts)}</blockquote>`); continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ol = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let t = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""); let cls = "";
        const cb = t.match(/^\[( |x|X)\]\s+/); if (cb) { cls = "cb" + (cb[1] === " " ? "" : " x"); t = t.slice(cb[0].length); }
        items.push(`<li class="${cls}">${mdInline(t, opts)}</li>`); i++;
      }
      out.push(ol ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`); continue;
    }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*([-*+]|\d+[.)])\s|&gt;)/.test(lines[i]) && !isTable(lines[i])) { p.push(lines[i]); i++; }
    if (!p.length) { out.push(`<p>${mdInline(l, opts)}</p>`); i++; continue; }
    out.push(`<p>${mdInline(p.join(" "), opts)}</p>`);
  }
  return `<div class="md">${out.join("")}</div>`;
}
const checkItems = body => String(body || "").split(/\r?\n/).map(l => l.match(/^\s*[-*+]\s+\[[ xX]\]\s+(.*)$/)).filter(Boolean).map(m => stripWl(m[1]).trim());

/* Stichwortsuche über die Wissensbasis (Grundlage für die KI-Antworten) */
const normT = t => String(t || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
const STOP = new Set("der die das und oder fuer mit von bei im in am an auf zu zum zur ist sind wie was wo wann welche welcher welches ein eine einer eines einem einen den dem des nicht kein keine ich wir man es auch noch nur bitte gibt soll muss kann aus nach ueber unter vor wird werden habe haben fur sich wieviel viel lange".split(" "));
const tokens = q => [...new Set(normT(q).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w)))];
function searchNotes(q) {
  const ts = tokens(q); if (!ts.length) return [];
  return Object.values(S.notes).map(n => {
    const T = normT(n.title), G = normT((n.tags || []).join(" ") + " " + (n.category || "") + " " + (KIND_TXT[n.kind] || "")), B = normT(n.body);
    let sc = 0, hit = 0;
    for (const w of ts) { const st = w.length > 5 ? w.slice(0, w.length - 2) : w; let h = 0; if (T.includes(st)) { sc += 6; h = 1; } if (G.includes(st)) { sc += 4; h = 1; } const c = B.split(st).length - 1; if (c) { sc += Math.min(c, 5); h = 1; } hit += h; }
    return { n, sc: sc * (0.5 + hit / ts.length) };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).map(x => x.n);
}

async function ask(q) {

  UI.ask.turns.push(turn); UI.ask.turns = UI.ask.turns.slice(-6);

/* Obsidian-Import: Markdown-Dateien mit Frontmatter, Tags und [[Verweisen]] */
function parseObsidian(text, path) {
  let body = String(text).replace(/^﻿/, ""); const fm = {};
  const m = body.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (m) {
    body = body.slice(m[0].length); let key = null;
    m[1].split(/\r?\n/).forEach(l => {
      const kv = l.match(/^([A-Za-zÄÖÜäöüß_-]+):\s*(.*)$/);
      if (kv) { key = kv[1].toLowerCase(); let v = kv[2].trim(); if (/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(",").map(x => x.trim().replace(/^["']|["']$/g, "")).filter(Boolean); fm[key] = v === "" ? [] : v; }
      else if (key && /^\s*-\s+/.test(l)) { if (!Array.isArray(fm[key])) fm[key] = fm[key] ? [fm[key]] : []; fm[key].push(l.replace(/^\s*-\s+/, "").trim().replace(/^["']|["']$/g, "")); }
    });
  }
  const parts = String(path).split("/"); const file = parts.pop().replace(/\.(md|markdown)$/i, "");
  const title = (typeof fm.title === "string" && fm.title) || (body.match(/^#\s+(.+)$/m) || [])[1] || file;
  const inline = [...body.matchAll(/(^|\s)#([A-Za-zÄÖÜäöüß0-9_\-/]{2,})/g)].map(x => x[2]);
  const tags = [...new Set([...(Array.isArray(fm.tags) ? fm.tags : fm.tags ? [fm.tags] : []), ...inline].map(t => String(t).replace(/^#/, "").toLowerCase()))].slice(0, 12);
  const typ = normT([fm.typ, fm.type, fm.art].flat().filter(Boolean).join(" ") + " " + title + " " + tags.join(" "));
  const kind = /protokoll/.test(typ) ? "protokoll" : /checkliste|checklist/.test(typ) ? "checkliste" : /anleitung|verarbeitung|programm|sop|ablauf/.test(typ) ? "anleitung" : checkItems(body).length >= 3 ? "checkliste" : "notiz";
  const category = (typeof fm.kategorie === "string" && fm.kategorie) || (typeof fm.category === "string" && fm.category) || (parts.length ? parts[parts.length - 1] : "");
  return { title: String(title).trim(), kind, category, tags, body: body.slice(0, 60000), source: path };
}

/* Dateien hochladen (Fotos werden verkleinert) */
async function compressImage(file) {
  try {
    const bmp = await createImageBitmap(file); const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82)); return b || file;
  } catch (e) { return file; }
}
const UPLOAD_ERR = { too_large: "Die Datei ist zu groß (max. 6 MB).", unsupported_type: "Dieser Dateityp wird nicht unterstützt.", not_granted: "Keine Berechtigung zum Hochladen.", store_unavailable: "Speicher gerade nicht erreichbar, bitte erneut versuchen." };
async function uploadFile(file) {
  if (!ASSETS) throw { code: "no_assets" };
  const img = /^image\//.test(file.type) && !/svg|gif/.test(file.type);
  const blob = img ? await compressImage(file) : file;
  const r = await ASSETS.upload(blob, blob.type ? undefined : { type: file.type || "application/octet-stream" });
  return { id: r.id, name: file.name || "Foto", type: r.contentType || blob.type };
}

const orderValue = o => { if (o.price !== undefined && o.price !== null && o.price !== "") return +o.price || 0; const jt = S.jobtypes[o.typeId]; return jt ? (+jt.basePrice || 0) + (+jt.price || 0) * (+o.units || 1) : 0; };

const PERIODS = [["1m", "Dieser Monat"], ["3m", "Letzte 3 Monate"], ["jahr", "Dieses Jahr"], ["12m", "12 Monate"]];
function vUmsatz() {

  const byType = group(o => S.jobtypes[o.typeId]?.name || "?"), byPrac = group(o => o.practice || "?").slice(0, 8);

      ${myAbs.length ? `<div class="alist">${myAbs.map(a => `<div class="aitem" data-act="editabs" data-id="${a.id}"><span class="mono small">${fmt(a.from)}</span><div><div class="t">${esc(a.type)}</div><div class="d">bis ${fmt(a.to || a.from)}</div></div><span class="btn ghost small">Bearbeiten</span></div>`).join("")}</div>` : `<div class="empty">Keine geplanten Abwesenheiten.</div>`}</section>

function orderOrow(o) {

  const n = (jt?.steps || []).length, dn = done ? n : (o.doneSteps || []).length, pc = n ? Math.round(dn / n * 100) : 0;
  const nx = (r.steps || []).find(x => !x.done); const stage = done ? "Geliefert" : nx && jt ? jt.steps[nx.i].name : "Alle Schritte erledigt";
  const dueTxt = done ? fmt(delDay(o)) : o.due === TODAY ? "Heute" : o.due === addDays(TODAY, 1) ? "Morgen" : fmt(o.due);
  const sub = done ? "geliefert" : r.finish ? `fertig ${fmt(r.finish)}` : "";
  const warn = !done && r.warnings && r.warnings.length ? `<div class="os" style="color:var(--bad)">${esc(r.warnings[0])}</div>` : "";
  return `<div class="orow" data-act="order" data-id="${o.id}">
    <span class="oic st-${st}">${toothSvg}</span>
    <div class="omain"><div class="ot">${esc(o.practice)} <span class="muted small">#${esc(o.nr)}</span>${o.priority === "eilt" ? ' <span class="tagx bad">Eilt</span>' : ""}${o.billing === "kasse" ? ' <span class="tagx kasse">Kasse</span>' : ""}</div><div class="os">${esc(o.patient)} · ${esc(jt?.name || "?")} × ${esc(o.units)}${o.shade ? " · " + esc(o.shade) : ""}</div>${warn}</div>
    <div class="odue"><b>${dueTxt}</b><span>${sub}</span></div>
    <div class="oprog"><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="tagx s-${st}">${esc(stage)}</span><span class="grow"></span><span class="small muted">${dn}/${n}</span></div><div class="pbar"><i class="st-${st}" style="width:${Math.max(4, pc)}%"></i></div></div>
    <span class="ochev" aria-hidden="true">›</span></div>`;
}
function vOrders() {

  const nDel = Object.values(S.orders).length - act.length;

      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="osearch" placeholder="Nr., Praxis, Patient, Auftragsart" value="${esc(UI.search)}" aria-label="Aufträge durchsuchen"></label></div>
    <div class="ohead2"><span>Auftrag</span><span>${f === "geliefert" ? "Geliefert" : "Fälligkeit"}</span><span>Arbeitsstand</span></div>

function fillOrderRows() {
  const box = $("#orows"); if (!box) return;
  const q = normT(UI.search.trim());
  let list = Object.values(S.orders); const F = UI.orderFilter;
  if (F === "aktiv") list = list.filter(o => o.status !== "geliefert");
  if (F === "spaet") list = list.filter(o => o.status !== "geliefert" && (stOf(o) === "spaet" || stOf(o) === "problem"));
  if (F === "knapp") list = list.filter(o => o.status !== "geliefert" && stOf(o) === "knapp");
  if (F === "geliefert") list = list.filter(o => o.status === "geliefert");
  if (q) list = list.filter(o => normT([o.nr, o.practice, o.patient, S.jobtypes[o.typeId]?.name].join(" ")).includes(q));
  if (!list.length) { box.innerHTML = `<div class="empty" style="margin:16px 22px 22px">Keine Aufträge in dieser Auswahl.</div>`; return; }
  const LIM = 150;
  if (F === "geliefert" || F === "alle") {
    list.sort((a, b) => (a.status === "geliefert") - (b.status === "geliefert") || (a.status === "geliefert" ? (delDay(b) < delDay(a) ? -1 : 1) : cmpOrders(a, b)));
    box.innerHTML = list.slice(0, LIM).map(orderOrow).join("") + (list.length > LIM ? `<div class="small muted" style="padding:12px 22px">und ${list.length - LIM} weitere, bitte Suche nutzen</div>` : ""); return;
  }
  list.sort(cmpOrders);
  const wk = workdays(TODAY, 5), wk2 = workdays(TODAY, 10);
  const G = [["over", "Überfällig", o => o.due && o.due < TODAY], ["today", "Heute fällig", o => o.due === TODAY], ["week", "Bis " + fmt(wk[4]), o => o.due && o.due <= wk[4]], ["next", "Bis " + fmt(wk2[9]), o => o.due && o.due <= wk2[9]], ["later", "Später oder ohne Termin", () => true]];
  const groups = G.map(g => ({ g, items: [] }));
  list.forEach(o => groups.find(x => x.g[2](o)).items.push(o));
  box.innerHTML = groups.filter(x => x.items.length).map(x => `<div class="ogroup ${x.g[0] === "over" ? "bad" : ""}"><span>${x.g[1]}</span><span class="n">${x.items.length}</span></div>${x.items.map(orderOrow).join("")}`).join("");
}

    const isNew = !UI.modal.id; save("notes", d); UI.noteId = d.id; closeModal(); toast(isNew ? "Wissen ergänzt." : "Notiz gespeichert.");
  },
  opennote: a => { if (!S.notes[a.id]) return; closeModal(); UI.noteId = a.id; if (UI.tab !== "wissen") { UI.tab = "wissen"; render(); } else { render(); } const r = $("#noteReader"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); },
  nfilter: a => { UI.nkind = a.k; render(); },
  askq: a => ask(a.k),
  askstop: () => { try { UI.ask.ctl?.abort(); } catch (e) {} },
  askclear: () => { UI.ask.turns = []; fillAnswer(); },
  asksave: () => { const t = UI.ask.turns[UI.ask.turns.length - 1]; if (!t || !t.a) return; const refs = t.hits.filter(id => S.notes[id]).map(id => `- [[${S.notes[id].title}]]`).join("\n"); openNoteModal(null, { title: t.q.replace(/\?$/, ""), kind: "notiz", category: "KI-Antworten", tags: ["ki-antwort", "prüfen"], body: `> KI-Antwort vom ${fmt(TODAY)}, bitte fachlich prüfen.\n\n${t.a}${refs ? `\n\n## Quellen\n${refs}` : ""}` }); },
  importmd: () => { UI.modal = { kind: "import", items: [] }; openModal(importModal(), UI.modal); },
  doimport: async () => {
    const items = UI.modal.items || []; let n = 0;
    for (const x of items) { const ex = x.existing && S.notes[x.existing]; const d = { ...(ex || { author: UI.me, attachments: [] }), title: x.title, kind: x.kind, category: x.category, tags: x.tags, body: x.body, source: x.source, updatedAt: new Date().toISOString(), editedBy: UI.me }; if (ex) d.id = ex.id; await save("notes", d); n++; }
    closeModal(); UI.tab = "wissen"; render(); toast(`${n} Notiz${n === 1 ? "" : "en"} aus Obsidian übernommen.`);
  },
  /* Fälle */
  opencase: a => { if (!S.orders[a.id]) return; closeModal(); UI.caseId = a.id; UI.caseMode = UI.caseMode || "notiz"; UI.tab = "fall"; render(); window.scrollTo(0, 0); },
  cfilter: a => { UI.cfilter = a.k; render(); },
  casemode: a => { UI.caseMode = a.k; render(); },
  casenote: async () => { const t = val("c_text").trim(); if (!t) return toast("Bitte eine Notiz schreiben."); await addCaseEntry(UI.caseId, { kind: "notiz", text: t }); toast("Notiz gespeichert."); },
  casemat: async () => {
    const mid = val("c_mat"), lot = val("c_lot"), q = +val("c_qty"); if (!mid || !lot) return toast("Keine Charge auf Lager. Bitte zuerst Wareneingang buchen."); if (!(q > 0)) return toast("Bitte eine Menge eintragen.");
    const o = S.orders[UI.caseId]; if (!(await bookMove(mid, -1, lot, q, o?.nr))) return;
    await addCaseEntry(UI.caseId, { kind: "material", materialId: mid, lot, qty: q, text: val("c_mtext").trim() }); toast("Material gebucht und dokumentiert.");
  },
  caseprot: a => { const n = S.notes[a.k]; if (!n) return; UI.modal = { kind: "prot", oid: UI.caseId, noteId: n.id, title: n.title, items: checkItems(n.body).map(t => ({ t, r: "", c: "" })), text: "" }; openModal(protocolModal(), UI.modal); },
  protset: a => { readProt(); UI.modal.items[+a.i].r = a.k; $("#sheet").innerHTML = protocolModal(); },
  protall: () => { readProt(); UI.modal.items.forEach(x => { if (!x.r) x.r = "ok"; }); $("#sheet").innerHTML = protocolModal(); },
  saveprot: async () => { readProt(); const d = UI.modal; const open = d.items.filter(x => !x.r).length; if (open) return toast(`Noch ${open} Prüfpunkt${open === 1 ? "" : "e"} offen.`); const oid = d.oid; closeModal(); await addCaseEntry(oid, { kind: "pruefung", protocol: { noteId: d.noteId, title: d.title, items: d.items }, text: d.text || "" }); toast("Prüfprotokoll gespeichert."); },
  delentry: async (a, el) => { if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Löschen?"; el.classList.add("danger"); return; } const c = JSON.parse(JSON.stringify(S.cases[a.id] || { entries: [] })); c.id = a.id; c.entries = c.entries.filter(e => e.id !== a.k); await save("cases", c); toast("Eintrag gelöscht."); },
  casesum: () => caseSummary(),
  /* Material */
  mfilter: a => { UI.mfilter = a.k; render(); },
  matopen: a => { const m = S.materials[a.id]; if (!m) return; if (UI.tab !== "material") { UI.tab = "material"; render(); } openModal(matDetail(m), { kind: "mat", id: a.id }); },
  matmove: (a, el, ev) => { ev && ev.stopPropagation(); const m = S.materials[a.id]; if (!m) return; if (+a.k > 0 && !can("material.manage")) return; if (+a.k < 0 && !(m.lots || []).some(l => +l.qty > 0)) return toast("Kein Bestand vorhanden."); openModal(moveModal(m, +a.k), { kind: "move", id: a.id }); },
  savemove: async a => {
    const dir = +a.k, lot = val("mv_lot").trim(), q = +val("mv_qty"); if (!lot) return toast("Bitte eine Charge angeben."); if (!(q > 0)) return toast("Bitte eine Menge eintragen.");
    const ref = dir < 0 ? val("mv_ref").trim() : ""; const ok = await bookMove(a.id, dir, lot, q, ref, dir > 0 ? val("mv_exp") : ""); if (!ok) return;
    const o = ref && findOrder(ref); if (o) await addCaseEntry(o.id, { kind: "material", materialId: a.id, lot, qty: q, text: "" });
    closeModal(); toast(dir < 0 ? (o ? `Entnahme gebucht und im Fall ${o.nr} dokumentiert.` : "Entnahme gebucht.") : "Wareneingang gebucht.");
  },
  editmat: a => { if (!can("material.manage")) return; openModal(matModal(a.id ? S.materials[a.id] : null), { kind: "matedit", id: a.id }); },
  savemat: () => { const m = { ...(UI.modal.id ? S.materials[UI.modal.id] : { lots: [], moves: [] }), name: val("mt_name").trim(), manufacturer: val("mt_man").trim(), supplier: val("mt_sup").trim(), category: val("mt_cat").trim(), unit: val("mt_unit").trim() || "Stück", minStock: +val("mt_min") || 0, price: +val("mt_price") || 0, noteId: val("mt_note") }; if (!m.name) return toast("Bitte eine Bezeichnung eintragen."); save("materials", m); closeModal(); toast("Material gespeichert."); },
  /* Umsatz */
  rperiod: a => { UI.rperiod = a.k; render(); },
  /* Meine Zeiten */
  dhreset: a => { const e = JSON.parse(JSON.stringify(S.employees[UI.me])); delete (e.dayHours || {})[a.k]; save("employees", e); toast("Standardzeit wiederhergestellt."); },
  savehours: () => { const e = JSON.parse(JSON.stringify(S.employees[UI.me])); e.hours = [0, 1, 2, 3, 4].map(i => Math.max(0, +val("mh_" + i) || 0)); save("employees", e); toast("Regelarbeitszeit gespeichert, Plan neu berechnet."); },
  savepin: async () => { const p1 = val("pin1"), p2 = val("pin2"); if (!/^\d{4}$/.test(p1)) return toast("Die PIN braucht genau 4 Ziffern."); if (p1 !== p2) return toast("Die beiden PINs stimmen nicht überein."); const e = JSON.parse(JSON.stringify(S.employees[UI.me])); e.pinHash = await pinHash(e.id, p1); save("employees", e); toast("PIN geändert."); },
  longer: a => { const o = S.orders[UI.scanId]; if (!o) return; openModal(longerModal(o, +a.i), { kind: "longer", oid: o.id, i: +a.i }); },
  savelonger: a => {
    const o = S.orders[UI.modal.oid]; if (!o) return; const i = UI.modal.i;
    const m = a.k === "reset" ? null : +(a.k || val("lg_min")); if (m !== null && !(m > 0)) return toast("Bitte Minuten eintragen.");
    const before = stOf(o), d = JSON.parse(JSON.stringify(o)); d.extra = d.extra || {};
    if (m === null) delete d.extra[i]; else d.extra[i] = (+d.extra[i] || 0) + m;
    closeModal(); save("orders", d);
    const after = stOf(S.orders[d.id]), r = PLAN.res[d.id] || {};
    UI.scanMsg = { ok: rank[after] <= rank[before] || after === "ok", text: m === null ? "Meldung zurückgesetzt." : `+${fmtMin(m)} gemeldet. ${d.nr} jetzt fertig ${fmt(r.finish)}${rank[after] > rank[before] ? `, Status „${STATUS_TXT[after]}“. Bitte Planung informieren.` : ", Liefertermin hält."}` }; fillScan();
  },
  timefix: async a => {
    const f = UI.scanMsg && UI.scanMsg.fix; if (!f) return; const o = S.orders[f.oid]; if (!o || !(o.doneLog || {})[f.i]) return;
    const d = JSON.parse(JSON.stringify(o)); d.doneLog[f.i].min = Math.max(5, (+d.doneLog[f.i].min || 0) + +a.k); f.min = d.doneLog[f.i].min;
    save("orders", d); fillScan();
  }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (e.target.closest("input, select, textarea")) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("submit", e => {
  if (e.target.id === "gsearch") { e.preventDefault(); UI.q = $("#gq").value.trim(); if (!UI.q) return; UI.tab = "suche"; render(); window.scrollTo(0, 0); $("#gq").value = ""; return; }
  if (e.target.id === "askForm") { e.preventDefault(); const q = $("#askIn").value; $("#askIn").value = ""; ask(q); return; } if (e.target.id === "scanForm") { e.preventDefault(); scanSubmit($("#scanIn").value); } });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#camOv")) { closeCam(); return; } if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
document.addEventListener("input", e => {
  if (e.target.id === "osearch") { UI.search = e.target.value; fillOrderRows(); return; }
  if (e.target.id === "nq" || e.target.id === "cq" || e.target.id === "mq") { UI[e.target.id] = e.target.value; clearTimeout(UI.typeT); UI.typeT = setTimeout(render, 180); return; }
  const k = e.target.dataset.chk; if (k && UI.check) {
    const v = e.target.value; UI.check[k] = k === "units" ? Math.max(1, +v || 1) : k === "eilt" ? v === "1" : v;
    if (k === "typeId") { render(); return; }
    if ((k === "received" || k === "due") && !v) return;
    fillCheck();
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "attIn" && UI.modal && UI.modal.kind === "note") {
    readNote(); const files = [...e.target.files]; toast("Wird hochgeladen …");
    (async () => { for (const f of files) { try { UI.modal.draft.attachments = UI.modal.draft.attachments || []; UI.modal.draft.attachments.push(await uploadFile(f)); } catch (err) { toast(UPLOAD_ERR[err && err.code] || "Hochladen fehlgeschlagen."); } }
      if (UI.modal && UI.modal.kind === "note") { $("#sheet").innerHTML = noteModal(UI.modal.id ? S.notes[UI.modal.id] : null); toast("Anhang hinzugefügt."); } })();
    return;
  }
  if ((e.target.id === "mdIn" || e.target.id === "mdDir") && UI.modal && UI.modal.kind === "import") { readMdFiles(e.target.files); return; }
  if (e.target.id === "photoIn" && e.target.files[0]) {
    const f = e.target.files[0], oid = UI.caseId, cap = val("c_cap").trim(); toast("Foto wird gespeichert …");
    uploadFile(f).then(r => addCaseEntry(oid, { kind: "foto", assetId: r.id, text: cap }).then(() => toast("Foto gespeichert.")), err => toast(UPLOAD_ERR[err && err.code] || "Foto konnte nicht gespeichert werden."));
    return;
  }
  if (e.target.id === "c_mat") { UI.caseMat = e.target.value; render(); return; }
  if (e.target.id === "revVis") { save("config", { id: "main", ...cfg(), revenueVisibility: e.target.value }); toast("Sichtbarkeit gespeichert."); return; }
  if (e.target.dataset.dh) {
    const d = e.target.dataset.dh, v = e.target.value; const emp = JSON.parse(JSON.stringify(S.employees[UI.me])); emp.dayHours = emp.dayHours || {};
    const std = +(emp.hours || [])[parse(d).getDay() - 1] || 0;
    if (v === "" || +v === std) delete emp.dayHours[d]; else emp.dayHours[d] = Math.max(0, Math.min(14, +v));
    Object.keys(emp.dayHours).forEach(k => { if (k < TODAY) delete emp.dayHours[k]; });
    save("employees", emp); toast(`${fmt(d)}: ${v === "" ? std : v} h, Plan neu berechnet.`); return;
  }
  if (e.target.id === "s_me") { UI.me = e.target.value; try { localStorage.setItem(LS_ME, UI.me); } catch (err) {} UI.scanMsg = null; render(); return; }
  const a = e.target.dataset.actChange;
  if (UI.modal && UI.modal.kind === "order" && (a === "otype" || a === "ounits")) {
    const d = readOrderForm();
    if (a === "otype") { d.doneSteps = []; d.tryins = {}; d.assign = {}; UI.modal.typeAtOpen = d.typeId; }
    const r = !UI.modal.isNew && d.status !== "geliefert" ? plan([...activeOrders().filter(o => o.id !== d.id), { ...d }]).res[d.id] : null;
    $("#ostepbox").innerHTML = stepList(S.jobtypes[d.typeId], r, d.units, true, d);
  }
  if (UI.modal && UI.modal.kind === "jt" && e.target.dataset.jf === "kind") { readJt(); $("#sheet").innerHTML = jtModal(); }
});
try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) UI.tab = h; } catch (e) {}
syncTheme();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme); } catch (e) {}
boot();
